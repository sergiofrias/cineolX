name: Build CineolX VST3 (Windows)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: true
        default: 'v1.0.0-skin'
      release_title:
        description: 'Release Title'
        required: true
        default: 'CineolX 224 VST3 (Custom Skin)'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize desktop dependency
        run: git submodule update --init deps/reflexion

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Windows Plugin
        shell: pwsh
        run: |
          ./script/build_plugin.ps1 -Jobs 4

      - name: Package VST3 Only
        shell: pwsh
        run: |
          # 1. Locate the built .vst3 folder automatically
          $vst3Path = (Get-ChildItem -Path "build" -Filter "*.vst3" -Recurse -Directory | Select-Object -First 1).FullName
          Write-Host "Found VST3 at: $vst3Path"

          # 2. Compress only the .vst3 bundle into a zip archive
          Compress-Archive -Path $vst3Path -DestinationPath "CineolX-224-VST3-Windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title }}
          body: |
            ### CineolX 224 (Windows x64 VST3)
            Custom skin build.

            ### Installation:
            1. Extract `CineolX-224-VST3-Windows-x64.zip`.
            2. Copy the `.vst3` folder into your VST3 directory:
               `C:\Program Files\Common Files\VST3\`
            3. Open your DAW and load your Lexicon 224 ROM files when prompted.
          files: CineolX-224-VST3-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
